<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />

    <!-- PWA Core -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RC Chófer" />
    <meta name="application-name" content="RC Chófer" />
    <meta name="theme-color" content="#030712" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="msapplication-TileColor" content="#030712" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Apple touch icons -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Apple splash screens (portrait) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>RC Chófer — Remises Concepción</title>
  </head>
  <body>
    <div id="error-overlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:red; color:white; padding:20px; z-index:999999; font-family:monospace; overflow:auto;">
      <h3>CRITICAL BOOT ERROR</h3>
      <pre id="error-log"></pre>
      <button onclick="window.location.reload()" style="padding:10px; background:white; color:red; border:none; margin-top:10px;">RELOAD</button>
    </div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-log').innerText += msg + '\n' + (error ? error.stack : '') + '\n\n';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-log').innerText += 'Unhandled Promise: ' + (event.reason ? (event.reason.stack || event.reason) : event) + '\n\n';
      });
    </script>
    <div id="root">
      <div style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; background-color: #030712; color: white; font-family: sans-serif; flex-direction: column; padding: 20px; box-sizing: border-box;">
        <img src="https://base44.app/api/apps/6a2195daf5c708d8398b3ca1/files/mp/public/6a2195daf5c708d8398b3ca1/a9e61fb71_9aaf2aa1d_whatsapp_image_2212741042823763.jpg" alt="RC" style="width: 120px; height: 120px; border-radius: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 20px; object-fit: cover;" />
        <h1 style="font-size: 2rem; font-weight: 800; text-align: center; color: white; margin: 0;">Remises Concepción</h1>
        <p style="color: #9ca3af; margin-top: 10px;">Cargando...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // PWABuilder detection snippet
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          try {
            if (navigator.userAgent.includes('RemisesConcepcion')) {
              // Eliminar SW en la app de escritorio (Electron) para evitar bloqueos
              navigator.serviceWorker.getRegistrations().then(regs => {
                for (let r of regs) r.unregister();
              }).catch(e => console.warn('SW unregister failed:', e));
            } else {
              navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(e => console.warn('SW register failed:', e));
            }
          } catch (err) {
            console.warn('SW Init failed:', err);
          }
        });
      }
    </script>
  </body>
</html>
