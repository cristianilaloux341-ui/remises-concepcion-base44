<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />

    <!-- PWA Core -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RC Chófer" />
    <meta name="application-name" content="RC Chófer" />
    <meta name="theme-color" content="#030712" />
    <meta name="msapplication-TileColor" content="#030712" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Apple touch icons -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Apple splash screens (portrait) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>RC Chófer — Remises Concepción</title>
  </head>
  <body>
    <div id="error-overlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:red; color:white; padding:20px; z-index:999999; font-family:monospace; overflow:auto;">
      <h3>CRITICAL BOOT ERROR</h3>
      <pre id="error-log"></pre>
      <button onclick="window.location.reload()" style="padding:10px; background:white; color:red; border:none; margin-top:10px;">RELOAD</button>
    </div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-log').innerText += msg + '\n' + (error ? error.stack : '') + '\n\n';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-log').innerText += 'Unhandled Promise: ' + (event.reason ? (event.reason.stack || event.reason) : event) + '\n\n';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // PWABuilder detection snippet
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          if (navigator.userAgent.includes('RemisesConcepcion')) {
            // Eliminar SW en la app de escritorio (Electron) para evitar bloqueos
            navigator.serviceWorker.getRegistrations().then(regs => {
              for (let r of regs) r.unregister();
            });
          } else {
            navigator.serviceWorker.register('/sw.js', { scope: '/' });
          }
        });
      }
    </script>
  </body>
</html>
