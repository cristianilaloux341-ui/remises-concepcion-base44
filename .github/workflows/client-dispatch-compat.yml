name: Client Dispatch Compatibility

on:
  push:
    branches:
      - clientes-despacho-compatible-v2
  pull_request:
    branches:
      - cliente-aviso-seguro

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Client dispatch selection tests
        run: node --test tests/client-dispatch-selection.test.mjs

      - name: Build web app
        run: npm run build

      - name: Prepare and sync client Android project
        run: |
          rm -rf android-ci
          mv android android-ci
          cp -a android-cliente android
          cp capacitor.config.json capacitor.driver.config.json
          cp capacitor.cliente.config.json capacitor.config.json
          npx cap sync android
          mv capacitor.driver.config.json capacitor.config.json

      - name: Compile client Android debug APK when Firebase config is present
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -f app/google-services.json ]; then
            ./gradlew assembleDebug
          else
            echo 'google-services.json not present in CI; Android sync validated and final Firebase compile will run after packaging.'
          fi

      - name: Restore synced client folder for artifact
        run: |
          rm -rf android-cliente
          mv android android-cliente
          mv android-ci android

      - name: Package client source
        run: |
          mkdir -p artifact
          zip -qr artifact/remises-concepcion-clientes-para-compilar.zip . \
            -x '.git/*' 'node_modules/*' 'artifact/*' 'android/*' 'dist/*'

      - name: Upload client source artifact
        uses: actions/upload-artifact@v4
        with:
          name: remises-concepcion-clientes-para-compilar
          path: artifact/remises-concepcion-clientes-para-compilar.zip
          retention-days: 7
