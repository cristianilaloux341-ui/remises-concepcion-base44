name: Client Dispatch Compatibility

on:
  push:
    branches:
      - clientes-despacho-compatible-v2
  pull_request:
    branches:
      - cliente-aviso-seguro

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Client dispatch selection tests
        run: node --test tests/client-dispatch-selection.test.mjs

      - name: Build web app
        run: npm run build

      - name: Sync client Android project
        run: npx cap sync android-cliente --config capacitor.cliente.config.json

      - name: Compile client Android debug APK without Firebase secret
        working-directory: android-cliente
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x processDebugGoogleServices

      - name: Package client source
        run: |
          mkdir -p artifact
          zip -qr artifact/remises-concepcion-clientes-para-compilar.zip . \
            -x '.git/*' 'node_modules/*' 'artifact/*' 'android/*' 'dist/*'

      - name: Upload client source artifact
        uses: actions/upload-artifact@v4
        with:
          name: remises-concepcion-clientes-para-compilar
          path: artifact/remises-concepcion-clientes-para-compilar.zip
          retention-days: 7
